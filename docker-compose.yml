version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bianto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bianto_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    container_name: bianto-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bianto_catalog?schema=public
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      PORT: 4000
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
    container_name: bianto-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.example
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

  prisma-studio:
    build:
      context: ./apps/api
    container_name: bianto-prisma-studio
    command: npm run prisma:studio
    env_file:
      - ./apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bianto_catalog?schema=public
    ports:
      - '5555:5555'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - postgres

volumes:
  postgres_data:
