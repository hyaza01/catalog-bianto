<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Commit trigger -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Bianto Store | Catalogo de Personalizados</title>
  </head>
  <body>
    <svg style="display:none" width="0" height="0">
      <defs>
        <filter id="distort">
          <feTurbulence type="turbulence" baseFrequency="0.02"
            numOctaves="3" result="noise" seed="2"/>
          <feDisplacementMap in="SourceGraphic" in2="noise"
            scale="0" xChannelSelector="R" yChannelSelector="G"
            id="displace-map"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
